name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      STABLE_KEYSTORE_B64: ${{ secrets.GESTCOURS_DEBUG_KEYSTORE_B64 }}

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v5

      - name: Installer Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer la plateforme Android
        shell: bash
        run: |
          rm -rf android
          flutter create --platforms=android --org fr.ecolegestion --project-name ecole_gestion_prof_mobile .
          python3 ci/patch_android.py

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le vrai code de l'application
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Construire l'APK de validation
        run: flutter build apk --debug

      - name: Préparer l'APK installable de validation
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/GESTCOURS_PROF_ANDROID_V0_5_4_RESEAU_AUTO.apk

      - name: Publier l'APK installable de validation
        uses: actions/upload-artifact@v4
        with:
          name: GESTCOURS_PROF_ANDROID_V0_5_4_RESEAU_AUTO
          path: dist/GESTCOURS_PROF_ANDROID_V0_5_4_RESEAU_AUTO.apk
          if-no-files-found: error
          retention-days: 30

      - name: Restaurer la signature Android stable
        if: ${{ env.STABLE_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$STABLE_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Recompiler avec la signature stable
        if: ${{ env.STABLE_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          flutter clean
          flutter pub get
          flutter build apk --debug
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/GESTCOURS_PROF_ANDROID_MODERNE_V0_5_4.apk

      - name: Publier l'APK stable
        if: ${{ env.STABLE_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: GESTCOURS_PROF_ANDROID_MODERNE_V0_5_4
          path: dist/GESTCOURS_PROF_ANDROID_MODERNE_V0_5_4.apk
          if-no-files-found: error
          retention-days: 30

      - name: Signature stable non configurée
        if: ${{ env.STABLE_KEYSTORE_B64 == '' }}
        shell: bash
        run: |
          echo '### APK V0.5.4 publiée — signature stable absente' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'La connexion teste la dernière adresse connue, puis la découverte UDP locale (47832) et le secours HTTP (47831).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ajoutez le secret `GESTCOURS_DEBUG_KEYSTORE_B64` pour publier un APK stable compatible avec les installations existantes.' >> "$GITHUB_STEP_SUMMARY"

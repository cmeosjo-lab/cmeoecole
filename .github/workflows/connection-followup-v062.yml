name: GESTCOURS V0.6.2 - connexion et suivi
on:
  workflow_dispatch:
  push:
    branches: ['release/v0.6.2-connexion-suivi']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: gestcours-v062-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Préparer et contrôler les sources
        run: |
          mkdir -p dist
          python3 ci/prepare_v062.py
          flutter pub get --enforce-lockfile
          dart fix --apply lib
          dart fix --apply test
          dart format lib test integration_test
          zip -qr dist/prepared-source-inspection.zip lib test integration_test pubspec.yaml pubspec.lock
          flutter analyze lib test 2>&1 | tee dist/analyse.txt
          flutter test test --reporter expanded 2>&1 | tee dist/tests.txt
      - name: Enregistrer les sources vérifiées
        id: source
        run: |
          git config user.name 'GESTCOURS Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test integration_test pubspec.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'V0.6.2+16 - écrans simplifiés, suivi archivable et attente autorisation'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          git archive --format=zip -o dist/GESTCOURS_MOBILE_V0_6_2_SOURCES.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GESTCOURS_V062_SOURCES_TESTS
          path: dist/
          retention-days: 30
  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Préparer Android sans changer les sources
        run: |
          rm -rf android
          flutter create --no-pub --platforms=android --org fr.ecolegestion --project-name ecole_gestion_prof_mobile .
          git restore --source=HEAD -- lib test pubspec.yaml pubspec.lock analysis_options.yaml
          rm -f test/widget_test.dart
          python3 ci/patch_android.py
          flutter pub get --enforce-lockfile
          mkdir -p dist
      - name: Compiler les deux APK release
        run: |
          flutter build apk --release --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk dist/GESTCOURS_PROF_ANDROID_V0_6_2_UNIVERSEL_VALIDATION.apk
          GESTCOURS_ARM64_ONLY=1 flutter build apk --release --target-platform android-arm64 --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk dist/GESTCOURS_PROF_ANDROID_V0_6_2_ARM64_VALIDATION.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          cp "$BT/lib/apksigner.jar" dist/apksigner.jar
          cp "$BT/aapt" dist/aapt
          cp "$BT/zipalign" dist/zipalign
          for APK in dist/*.apk; do
            "$BT/apksigner" verify --verbose --print-certs "$APK" >> dist/inspection.txt
            "$BT/aapt" dump badging "$APK" > /tmp/badging.txt
            cat /tmp/badging.txt >> dist/inspection.txt
            grep -q "versionCode='16' versionName='0.6.2'" /tmp/badging.txt
            if grep -q 'application-debuggable' /tmp/badging.txt; then exit 1; fi
          done
      - name: Préparer le test Android natif
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          flutter pub add --dev integration_test --sdk=flutter
          flutter analyze integration_test
          sed -i 's/0_6_1/0_6_2/g' ci/android_startup_smoke.sh
      - name: Démarrage, conservation et autorisation sur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash ci/android_startup_smoke.sh
            bash -o pipefail -c 'flutter test integration_test/sqlite_startup_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee dist/android-sqlite-tests.txt'
            bash -o pipefail -c 'flutter test integration_test/connection_followup_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee dist/android-connection-tests.txt'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GESTCOURS_ANDROID_V062_BUILD_TESTS
          path: dist/
          retention-days: 30
  ios:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Compiler pour iPhone sans signature
        run: |
          rm -rf ios
          flutter create --no-pub --platforms=ios --org fr.ecolegestion --project-name ecole_gestion_prof_mobile .
          git restore --source=HEAD -- lib test pubspec.yaml pubspec.lock analysis_options.yaml
          rm -f test/widget_test.dart
          python3 ci/patch_ios.py
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign --no-pub
          mkdir -p dist Payload
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/ios/iphoneos/Runner.app/Info.plist > dist/ios-version.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/ios/iphoneos/Runner.app/Info.plist >> dist/ios-version.txt
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry dist/GESTCOURS_PROF_IOS_V0_6_2_A_SIGNER.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GESTCOURS_IOS_V062_A_SIGNER
          path: dist/
          retention-days: 30

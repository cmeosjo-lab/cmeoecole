name: GESTCOURS V0.6.2 - QR et suivi
on:
  workflow_dispatch:
  push:
    branches: ['release/v0.6.2-qr-suivi']
permissions:
  contents: read
concurrency:
  group: gestcours-v062-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Préparer les sources
        shell: bash
        run: |
          python3 ci/prepare_v062.py
          python3 - <<'PY'
          from pathlib import Path
          f=Path('lib/screens/transmission_history_screen.dart')
          f.write_text(f.read_text().replace("$note}')", "$note'}')"))
          PY
          flutter pub get --enforce-lockfile
          dart format lib test integration_test
      - name: Conserver les sources exactes
        id: source
        shell: bash
        run: |
          git config user.name 'GESTCOURS Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test integration_test pubspec.yaml pubspec.lock ci/android_startup_smoke.sh
          if ! git diff --cached --quiet; then
            git commit -m 'V0.6.2+16: suivi sans perte, appairage QR et attente autorisation'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          mkdir -p dist
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip -o dist/GESTCOURS_MOBILE_V0_6_2_SOURCES.zip HEAD
      - name: Analyse et tests
        shell: bash
        run: |
          flutter analyze lib test 2>&1 | tee dist/flutter-analyze.txt
          flutter test --reporter expanded test 2>&1 | tee dist/flutter-tests.txt
      - name: Préparer Android
        shell: bash
        run: |
          rm -rf android
          flutter create --no-pub --platforms=android --org fr.ecolegestion --project-name ecole_gestion_prof_mobile .
          git restore --source=HEAD -- lib test pubspec.yaml pubspec.lock analysis_options.yaml
          rm -f test/widget_test.dart
          python3 ci/patch_android.py
          flutter pub get --enforce-lockfile
      - name: Compiler les deux APK
        shell: bash
        run: |
          flutter build apk --release --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk dist/GESTCOURS_PROF_ANDROID_V0_6_2_UNIVERSEL_VALIDATION.apk
          GESTCOURS_ARM64_ONLY=1 flutter build apk --release --target-platform android-arm64 --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk dist/GESTCOURS_PROF_ANDROID_V0_6_2_ARM64_VALIDATION.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          cp "$BT/lib/apksigner.jar" dist/apksigner.jar
          cp "$BT/aapt" dist/aapt
          cp "$BT/zipalign" dist/zipalign
          for APK in dist/*.apk; do
            "$BT/apksigner" verify --verbose --print-certs "$APK" >> dist/apk-inspection.txt
            "$BT/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
            cat "$RUNNER_TEMP/badging.txt" >> dist/apk-inspection.txt
            grep -q "versionCode='16' versionName='0.6.2'" "$RUNNER_TEMP/badging.txt"
            if grep -q application-debuggable "$RUNNER_TEMP/badging.txt"; then exit 1; fi
            if [[ "$APK" == *ARM64* ]]; then grep -Eq "^native-code: 'arm64-v8a'[[:space:]]*$" "$RUNNER_TEMP/badging.txt"; fi
          done
      - name: Préparer émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          flutter pub add --dev integration_test --sdk=flutter
          flutter analyze integration_test
      - name: Vérifier le démarrage et le stockage Android natif
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash ci/android_startup_smoke.sh
            bash -o pipefail -c 'flutter test integration_test -d emulator-5554 --reporter expanded 2>&1 | tee dist/android-native-tests.txt'
      - name: Restaurer les dépendances de production
        if: always()
        run: git restore --source=HEAD -- pubspec.yaml pubspec.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GESTCOURS_MOBILE_V062_ANDROID_ET_TESTS
          path: dist/
          retention-days: 30
          if-no-files-found: error
  ios:
    needs: android
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.android.outputs.source }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Compiler iOS avec les mêmes sources
        shell: bash
        run: |
          rm -rf ios
          flutter create --no-pub --platforms=ios --org fr.ecolegestion --project-name ecole_gestion_prof_mobile .
          git restore --source=HEAD -- lib test pubspec.yaml pubspec.lock analysis_options.yaml
          rm -f test/widget_test.dart
          python3 ci/patch_ios.py
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign --no-pub
          mkdir -p dist "$RUNNER_TEMP/ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/Runner.app"
          ROOT="$PWD"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$ROOT/dist/GESTCOURS_PROF_IOS_V0_6_2_A_SIGNER.ipa" Payload)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/ios/iphoneos/Runner.app/Info.plist > dist/ios-version.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/ios/iphoneos/Runner.app/Info.plist >> dist/ios-version.txt
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GESTCOURS_IOS_V062_A_SIGNER
          path: dist/
          if-no-files-found: error
          retention-days: 30

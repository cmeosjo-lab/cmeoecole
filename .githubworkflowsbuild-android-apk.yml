name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Générer la plateforme Android
        shell: bash
        run: |
          rm -rf android
          flutter create --platforms=android --org fr.ecolegestion --project-name ecole_gestion_prof_mobile .
          python3 ci/patch_android.py

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Construire l'APK installable
        run: flutter build apk --debug

      - name: Nommer l'APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/ECOLE_GESTION_PRO_ANDROID_V0_3_1.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ECOLE_GESTION_PRO_ANDROID_V0_3_1
          path: dist/ECOLE_GESTION_PRO_ANDROID_V0_3_1.apk
          if-no-files-found: error
          retention-days: 30
